<main class="preferences-shell"><h1>Preferences</h1><section><button class="blacklist-disclosure" type="button" [attr.aria-expanded]="expanded()" (click)="expanded.set(!expanded())">Blacklisted Games <span aria-hidden="true">{{ expanded() ? '⌃' : '⌄' }}</span></button>@if (expanded()) { @if (preferences.blacklistEntries().length) { <table><thead><tr><th>Game</th><th>Blacklisted on</th><th>Action</th></tr></thead><tbody>@for (entry of preferences.blacklistEntries(); track entry.id) { <tr [attr.data-blacklist-id]="entry.id"><td>{{ entry.gameName }}</td><td>{{ formatDate(entry.blacklistedAt) }}</td><td><button class="remove-blacklist" type="button" [attr.aria-label]="'Remove ' + entry.gameName + ' from blacklist'" (click)="preferences.removeBlacklist(entry.id)">Remove from blacklist</button></td></tr> }</tbody></table> } @else { <p>No games are blacklisted.</p> } }</section></main>
