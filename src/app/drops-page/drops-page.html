<main class="app-shell"><div class="page-heading"><div><h1>Active Drops</h1><p>{{ updatedLabel() }}</p></div><p>@if (loading()) { Loading… } @else { {{ drops().length }} active Drop{{ drops().length === 1 ? '' : 's' }} }</p></div><button class="refresh" type="button" (click)="loadDrops()">Refresh</button>@if (loadFailed()) { <section class="load-error" aria-live="polite"><p>We couldn't load active Drops right now.</p><button class="retry" type="button" (click)="loadDrops()">Retry</button></section> }<app-drop-list [favoriteDrops]="favoriteDrops()" [activeDrops]="activeDrops()" [newDropIds]="newDropIds()" [updatedDropIds]="updatedDropIds()" [loading]="loading()" (favoriteRequested)="preferences.addFavorite($event.id, $event.gameName)" (blacklistRequested)="preferences.addBlacklist($event.id, $event.gameName)" /></main>
