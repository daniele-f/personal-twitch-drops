<main class="app-shell"><div class="page-heading"><div><h1>Active Drops</h1></div></div><div class="refresh-status"><button class="refresh" type="button" (click)="loadDrops()">Refresh</button><p class="load-status" aria-live="polite">{{ updatedLabel() }}</p></div>@if (loading()) { <div class="load-progress" role="progressbar" aria-label="Fetching current Drops from TwitchDrops.app"><span>Fetching current Drops from TwitchDrops.app</span><span class="load-progress__bar" aria-hidden="true"></span></div> } @if (loadFailed()) { <section class="load-error" aria-live="polite"><p>We couldn't load active Drops right now.</p><button class="retry" type="button" (click)="loadDrops()">Retry</button></section> }<app-drop-list [favoriteDrops]="favoriteDrops()" [activeDrops]="activeDrops()" [newDropIds]="newDropIds()" [updatedDropIds]="updatedDropIds()" [loading]="loading()" (favoriteRequested)="preferences.addFavorite($event.id, $event.gameName)" (blacklistRequested)="preferences.addBlacklist($event.id, $event.gameName)" /></main>
