<span class="app-toggle" [attr.title]="tooltip()"><label [for]="controlId()" [attr.title]="tooltip()" [class.app-toggle__label--theme]="icon() === 'eye'">{{ label() }}</label><span class="app-toggle__track toggle" [class.app-toggle__track--eye]="icon() === 'eye'" [class.app-toggle__track--eye--enabled]="icon() === 'eye' && checked()"><input [id]="controlId()" type="checkbox" [attr.aria-label]="ariaLabel()" [checked]="checked()" (change)="change($any($event.target).checked)" /><label [for]="controlId()">@if (icon() === 'eye') { <svg class="app-toggle__icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">@if (checked()) { <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" /><circle cx="12" cy="12" r="3" /> } @else { <path d="m3 3 18 18" /><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8" /><path d="M9.9 4.2A10.5 10.5 0 0 1 12 4c6.5 0 10 8 10 8a18.4 18.4 0 0 1-3.2 4.7M6.6 6.6C3.7 8.6 2 12 2 12s3.5 7 10 7a9.8 9.8 0 0 0 2.6-.4" /> } </svg> }</label></span></span>
