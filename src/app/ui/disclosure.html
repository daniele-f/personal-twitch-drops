<button class="app-disclosure" type="button" [attr.aria-expanded]="expanded()" (click)="toggled.emit()">@if (icon(); as currentIcon) { <span class="app-disclosure__icon" aria-hidden="true">@if (starIcon()) { <span class="app-disclosure__star"><svg class="app-disclosure__star-fill" viewBox="0 0 24 24"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.9-6.2-3.3-6.2 3.3 1.2-6.9-5-4.9 6.9-1z" /></svg><svg class="app-disclosure__star-outline" viewBox="0 0 24 24"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.9-6.2-3.3-6.2 3.3 1.2-6.9-5-4.9 6.9-1z" /></svg></span> } @else { <span class="app-disclosure__icon-glyph">{{ currentIcon }}</span> }</span> }<span class="app-disclosure__label"><ng-content />@if (count() !== undefined) { <span class="app-disclosure__count"> ({{ count() }})</span> }</span><app-collapse-chevron [expanded]="expanded()" /></button>
