@if (loading()) {
  <p class="loading-message" aria-live="polite">Loading active Drops</p>
  <ul class="drop-list" aria-hidden="true">
    @for (skeleton of [0, 1, 2, 3]; track skeleton) {
      <li>
        <article class="drop-row drop-row--skeleton">
          <div class="skeleton-block skeleton-cover"></div>
          <div class="skeleton-copy"><span class="skeleton-block skeleton-title"></span><span class="skeleton-block skeleton-description"></span></div>
        </article>
      </li>
    }
  </ul>
} @else {
  <ul class="drop-list">
    @for (drop of drops(); track drop.id) {
      <li>
        <article class="drop-row">
          @if (drop.imageUrl) {
            <img class="cover-image" [src]="drop.imageUrl" [alt]="drop.gameName">
          } @else {
            <div class="cover-placeholder" aria-hidden="true"></div>
          }
          <div class="drop-copy"><h2>{{ drop.gameName }}</h2><p>{{ summary(drop) }}</p></div>
        </article>
      </li>
    }
  </ul>
}
