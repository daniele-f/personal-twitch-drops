<header class="app-header">
  <a class="wordmark" href="./" aria-label="Personal Twitch Drops home">Personal <span>Twitch Drops</span></a>
  <nav aria-label="Application actions">
    <button type="button">Preferences</button><button type="button">Changes · 2</button><button class="refresh" type="button" (click)="loadDrops()">Refresh</button>
  </nav>
</header>
<main class="app-shell">
  <div class="page-heading"><div><h1>Active Drops</h1><p>{{ updatedLabel() }}</p></div><p>@if (loading()) { Loading… } @else { {{ drops().length }} active Drop{{ drops().length === 1 ? '' : 's' }} }</p></div>
  @if (loadFailed()) {
    <section class="load-error" aria-live="polite"><p>We couldn't load active Drops right now.</p><button class="retry" type="button" (click)="loadDrops()">Retry</button></section>
  }
  <app-drop-list [favoriteDrops]="[]" [activeDrops]="drops()" [loading]="loading()" />
  <router-outlet />
</main>
