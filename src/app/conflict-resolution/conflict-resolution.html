<dialog appModalDialog [modalDismissible]="false" class="conflict-dialog" aria-label="Resolve game preferences">@for (conflict of conflicts(); track conflict.id) { <div class="conflict-row" [attr.data-conflict-id]="conflict.id"><p>Something went wrong with {{ conflict.gameName }}. Choose whether to keep it in Favorites or ignore it to continue.</p><div><button class="keep-favorite" type="button" (click)="keepFavorite(conflict.id)">Keep it in Favorites</button><button class="hide-game" type="button" (click)="hide(conflict.id)">Ignore it</button></div></div> }</dialog>
