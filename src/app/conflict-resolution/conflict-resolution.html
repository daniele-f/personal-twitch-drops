<div class="conflict-backdrop"><section class="conflict-dialog" role="dialog" aria-modal="true" aria-label="Resolve game preferences">@for (conflict of conflicts(); track conflict.id) { <div class="conflict-row" [attr.data-conflict-id]="conflict.id"><p>Something went wrong with {{ conflict.gameName }}.</p><div><button class="keep-favorite" type="button" (click)="keepFavoriteRequested.emit(conflict.id)">Keep it in Favorites</button><button class="hide-game" type="button" (click)="hideRequested.emit(conflict.id)">Hide it</button></div></div> }</section></div>
